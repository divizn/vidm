<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			// Avoids a flash of light theme before hydration.
			try {
				var vidmTheme = localStorage.getItem('vidm-theme');
				var vidmDark = vidmTheme ? vidmTheme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
				if (vidmDark) document.documentElement.classList.add('dark');
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
