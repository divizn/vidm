name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Manual escape hatch: the R2 upload gate below only fires on a change to
  # specific tracked files, so a failed or missed upload (or a bucket wiped
  # out of band) can't otherwise be re-run without an empty commit.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: www
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: www/pnpm-lock.yaml

      # postinstall downloads ~105MB of ONNX weights + runtime from
      # HuggingFace — pnpm's own cache above only covers node_modules, not
      # static/. Without this, every run on every PR re-downloads all of it:
      # slow, and a third-party outage becomes a red build on unrelated
      # changes. Keyed on the setup scripts (tracked, so a model/revision
      # change busts the cache automatically); safe because both scripts are
      # idempotent and download atomically via a temp file.
      - uses: actions/cache@v4
        with:
          path: |
            www/static/models
            www/static/ort
            www/static/whisper
          key: model-assets-${{ hashFiles('www/scripts/setup-whisper-webgpu.mjs', 'www/scripts/setup-whisper.mjs') }}

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - run: pnpm test

      - run: pnpm build

      # deploy re-uses this build output instead of rebuilding from scratch
      # (see deploy job) — same install, same source, no reason to redo it.
      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: www/build
          retention-days: 1

  deploy:
    needs: test
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: www
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # wrangler-action@v3 shells out via the detected package manager
      # (`pnpm dlx wrangler ...`) rather than bundling its own binary —
      # without pnpm on PATH it fails with "Unable to locate executable
      # file: pnpm" (confirmed: this is what broke the previous deploy
      # after these steps were dropped as "unused").
      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: www/pnpm-lock.yaml

      # See the matching step in the test job: postinstall downloads ~105MB
      # of ONNX weights + runtime from HuggingFace, and only this cache
      # (keyed on the tracked setup scripts) avoids re-fetching them here too.
      - uses: actions/cache@v4
        with:
          path: |
            www/static/models
            www/static/ort
            www/static/whisper
          key: model-assets-${{ hashFiles('www/scripts/setup-whisper-webgpu.mjs', 'www/scripts/setup-whisper.mjs') }}

      # wrangler-action checks for an already-installed `wrangler` first and
      # only falls back to installing its own pinned default if none is
      # found — that default (3.90.0) predates wrangler.jsonc/JSONC config
      # support, so it can't locate the entry point at all and fails with
      # "Missing entry-point" (confirmed: this repo's own devDependency is
      # wrangler ^4, which resolves wrangler.jsonc fine). Installing here
      # makes wrangler-action pick up that already-satisfied v4 instead of
      # reaching for its incompatible default.
      - run: pnpm install --frozen-lockfile

      # Reuses the build `test` already produced from the same commit
      # instead of rebuilding — `test` is a required dependency (needs:
      # test) so this artifact always exists by the time deploy runs.
      - uses: actions/download-artifact@v4
        with:
          name: build
          path: www/build

      # ffmpeg-core.wasm, the whisper model, and the two WebGPU whisper ONNX
      # weights are large and almost never change — re-uploading them to R2
      # on every deploy costs real time for no reason, so only do it when
      # this push actually touched one of them.
      #
      # The previous version of this check diffed the asset files themselves —
      # but they're gitignored and untracked, so `git diff` was always quiet and
      # this step never once fired. The tracked setup scripts (plus the
      # lockfile, since a dependency bump can change what they download
      # without editing the script itself) are the real source of truth for
      # which assets should exist, so diff those instead.
      #
      # No `www/` prefix on these pathspecs: this is a `run:` step, and the
      # job sets `defaults.run.working-directory: www`, so `git diff -- ...`
      # already resolves pathspecs relative to `www/`. Adding `www/` here
      # would look for `www/www/...`, match nothing, and silently make this
      # step dead code again (exactly the bug being fixed right now).
      # Contrast with the `actions/cache` step above: its `path:` and
      # `hashFiles()` are action *inputs*, not shell pathspecs — those are
      # always resolved relative to the repo root regardless of
      # working-directory, which is why that step correctly keeps the
      # `www/` prefix. That asymmetry between a `run:` step's shell cwd and
      # a `uses:` action's own input resolution is exactly what makes this
      # bug easy to reintroduce — check both conventions before editing
      # either kind of step here.
      #
      # workflow_dispatch has no before/after commit range to diff, so
      # treat a manual run as always wanting a re-upload — that's the whole
      # point of the manual trigger: recovering from a failed or missed
      # upload without an empty commit.
      - name: Check if large R2 assets changed
        id: r2-assets
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet ${{ github.event.before }} ${{ github.event.after }} -- \
            scripts/copy-ffmpeg-core.mjs \
            scripts/setup-whisper.mjs \
            scripts/setup-whisper-webgpu.mjs \
            pnpm-lock.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # onnxruntime ships several runtime builds (plain, .jsep, .jspi,
      # .asyncify) and picks one at runtime from the browser's capabilities, so
      # all of them are self-hosted — see setup-whisper-webgpu.mjs. The largest
      # (.jsep) is 24.9 MiB against Workers' 25 MiB per-file cap, so an
      # onnxruntime bump could silently push it over. Check every variant rather
      # than one by name: the whole reason the GPU path broke in Firefox was
      # hardcoding a single filename here and in the setup script.
      - name: Assert onnxruntime wasm still fits the static asset cap
        run: |
          status=0
          for f in build/ort/*.wasm; do
            size=$(stat -c%s "$f")
            echo "$(basename "$f"): $size bytes"
            if [ "$size" -ge 26214400 ]; then
              echo "::error::$(basename "$f") exceeds the 25 MiB Workers static asset cap — move it to R2 (see worker.ts)"
              status=1
            fi
          done
          if [ ! -e build/ort/ort-wasm-simd-threaded.asyncify.wasm ]; then
            echo "::error::the onnxruntime asyncify build is missing — Firefox selects it and the GPU path will fail"
            status=1
          fi
          exit $status

      # setup-whisper-webgpu.mjs deliberately soft-fails (exit 0, falls back
      # to CPU transcription) when the HuggingFace download doesn't complete
      # — that's the right behaviour for a local install without network
      # access. But in CI it means static/models/.../*.onnx can simply be
      # absent, and `r2 object put --file=` on a missing file below would
      # fail with an opaque file-not-found/R2 error that doesn't point at
      # the real cause. Check explicitly and name it. (Paths are relative to
      # `www/`, same as every other `run:` step in this job — see the
      # working-directory note on the r2-assets check above.)
      - name: Assert whisper-webgpu ONNX models downloaded successfully
        run: |
          for f in static/models/whisper-webgpu/onnx/encoder_model_fp16.onnx static/models/whisper-webgpu/onnx/decoder_model_merged_q4f16.onnx; do
            if [ ! -s "$f" ]; then
              echo "::error::$f is missing or empty — setup-whisper-webgpu.mjs did not complete its model download during install (it soft-fails and falls back to CPU rather than break local installs without network access). Re-run with network access, or check the model-assets cache above."
              exit 1
            fi
          done

      # ffmpeg-core.wasm, the whisper model, and the two WebGPU whisper ONNX
      # weights exceed Workers static assets' 25 MiB per-file limit —
      # deployed to R2 instead (see worker.ts) and stripped from the static
      # output here so the assets upload doesn't reject the deploy.
      - uses: cloudflare/wrangler-action@v3
        if: steps.r2-assets.outputs.changed == 'true'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: www
          command: |
            r2 object put vidm-assets/ffmpeg-core.wasm --file=static/ffmpeg/ffmpeg-core.wasm --content-type=application/wasm --cache-control=public,max-age=31536000,immutable
            r2 object put vidm-assets/ggml-tiny.en-q5_1.bin --file=static/whisper/ggml-tiny.en-q5_1.bin --content-type=application/octet-stream --cache-control=public,max-age=31536000,immutable
            r2 object put vidm-assets/whisper-webgpu/encoder_model_fp16.onnx --file=static/models/whisper-webgpu/onnx/encoder_model_fp16.onnx --content-type=application/octet-stream --cache-control=public,max-age=31536000,immutable
            r2 object put vidm-assets/whisper-webgpu/decoder_model_merged_q4f16.onnx --file=static/models/whisper-webgpu/onnx/decoder_model_merged_q4f16.onnx --content-type=application/octet-stream --cache-control=public,max-age=31536000,immutable

      # adapter-static's fallback:'index.html' generates a Pages-style
      # `/* /index.html 200` _redirects rule for SPA fallback — Workers
      # rejects it as an infinite-loop redirect (it's not a redirect there,
      # just a rewrite, unlike Pages). SPA fallback is instead handled by
      # `not_found_handling: "single-page-application"` in wrangler.jsonc,
      # so the generated file is just noise; strip it same as the oversized
      # files below.
      - run: rm -f build/_redirects build/ffmpeg/ffmpeg-core.wasm build/whisper/ggml-tiny.en-q5_1.bin build/models/whisper-webgpu/onnx/encoder_model_fp16.onnx build/models/whisper-webgpu/onnx/decoder_model_merged_q4f16.onnx

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: www
          command: deploy
